# Q3: linear probes on frozen backbones with k labelled frames per class.
paths:
  kvasir_index: data/index/kvasir.csv
  kvasir_cache: cache/kvasir_224
  class_mapping: configs/class_mapping.yaml
  runs_root: runs

fewshot:
  backbones: [dinov2_vits14, resnet50, convnext_tiny]
  shots: [1, 5, 20]
  draws: 10
  test_fold: 1
  seed: 0
  C: 10.0
  C_sensitivity: [1.0, 100.0]
  pretrained: true
  batch_size: 128
  num_workers: 4
  amp: true
  device: auto
