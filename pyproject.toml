[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "capsule-xai-audit"
version = "0.1.0"
description = "How much capsule-endoscopy results depend on data split, calibration and explanation method."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "scikit-image>=0.22",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0",
    "captum>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
cxa = "capsule_xai_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capsule_xai_audit = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PT", "RUF", "C4", "PIE"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Greek letters / Δ in docstrings are intended.

[tool.mypy]
python_version = "3.10"
files = ["src"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["timm.*", "captum.*", "skimage.*", "sklearn.*", "scipy.*", "torchvision.*", "pandas.*", "matplotlib.*", "tqdm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: needs a CUDA device",
    "slow: end-to-end tests that train a model",
]
filterwarnings = ["ignore::DeprecationWarning:timm.*"]
